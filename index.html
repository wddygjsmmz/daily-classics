window.TRACKS = [
  {
    title: "月光", original: "Clair de lune", composer: "克洛德·德彪西", latin: "Claude Debussy",
    period: "印象主义", genre: "钢琴独奏", duration: 304,
    summary: "开头的几个音之间留着空隙。听它们怎样从安静的和声，慢慢汇成一片流动的月色。",
    about: "《月光》是钢琴作品《贝加马斯克组曲》的第三首。开头的旋律常常由两个音一起唱出，声音很轻，句尾又停得很久。到了中段，原先相对静止的和弦被拆开，变成一道道向上翻涌的音流。再听到开头的旋律时，你也许会觉得月色比先前更静了。这是同一架钢琴靠音区、触键和留白造成的变化。",
    cues: [{label:"开头的留白",text:"先跟着最上面那个音哼。留意每句话停住时，先前弹下的声音还在慢慢消散。"}, {label:"水波流动起来",text:"中段让低处的琴声带路。一串串从低到高的音叫作琶音；试着在它们上方继续寻找那条较慢的旋律。"}, {label:"再听一次开头",text:"熟悉的短句回来时，比较它身后的伴奏。最后几声琶音与中段遥相呼应，随后安静落下。"}],
    file:"b/be/Clair_de_lune_%28Claude_Debussy%29_Suite_bergamasque.ogg",credit:"Laurens Goedhart（钢琴，2011）",license:"CC BY 3.0"
  },
  {
    title:"C大调前奏曲",original:"Prelude in C major, BWV 846",composer:"约翰·塞巴斯蒂安·巴赫",latin:"Johann Sebastian Bach",
    period:"巴洛克",genre:"键盘独奏",duration:179,
    summary:"指尖重复着近乎相同的动作，底下的和声却一直在走。跟住低音，就能听出这条路的起伏。",
    about:"这是《平均律键盘曲集》第一卷的开篇。前奏曲之后接着一首赋格，今天只听前奏曲。巴赫把本可同时按下的一组音拆开，按相似的顺序一次次弹出。短小的音型给了耳朵一个稳定的参照：只要其中一个音挪动一点，整片和声的明暗便随之改变。",
    cues:[{label:"认出音型",text:"开头用手掌轻画一个向上再折返的弧线。下一个短句沿着近似的路线走过。"}, {label:"把注意力移低",text:"暂时放下细密的高音，每换一组音，只记住最下面的那个。听低音移动与停留时，心里的松紧如何变化。"}, {label:"等待落点",text:"接近结尾，一直规律循环的音型改变了形状。等最后的和弦一起响起，比较它与开场的音色。"}],
    file:"0/02/Kevin_MacLeod_-_J_S_Bach_Prelude_in_C_-_BWV_846.ogg",credit:"Kevin MacLeod",license:"CC BY 3.0"
  },
  {
    title:"在山魔王的宫殿里",original:"In the Hall of the Mountain King",composer:"爱德华·格里格",latin:"Edvard Grieg",
    period:"浪漫主义",genre:"管弦乐",duration:154,
    summary:"一段踮着脚的旋律反复出现。每次回头，它都比刚才更快、更响，身边也多了几件乐器。",
    about:"格里格为易卜生的戏剧《培尔·金特》写下配乐，后来把这段音乐放在第一组曲末尾。舞台上的培尔闯入了山魔王的世界。即使不知道剧情，也可以从重复中听到一场追逐：同一段旋律在不同音区传递，乐队逐层加入，音量和速度一起抬升。",
    cues:[{label:"脚步从低处出发",text:"低音区的短音之间有细小的间隙。轻轻点脚，把开头那段旋律记在耳朵里。"}, {label:"听谁接过旋律",text:"声音移到高处时，旋律仍然眼熟。比较它在低处和高处的重量，听背后的节奏怎样越来越密。"}, {label:"最后的追逐",text:"继续用开头的速度点脚，看看什么时候会跟不上。临近结尾，强烈的齐奏和重击终于打断先前的循环。"}],
    file:"b/bb/Musopen_-_In_the_Hall_Of_The_Mountain_King.ogg",credit:"捷克国家交响乐团（Musopen 委约录音）",license:"公有领域"
  },
  {
    title:"土耳其进行曲",original:"Rondo alla turca, K. 331",composer:"沃尔夫冈·阿马德乌斯·莫扎特",latin:"Wolfgang Amadeus Mozart",
    period:"古典主义",genre:"钢琴独奏",duration:181,
    summary:"从一小串轻巧的音符出发，忽然踏进响亮的队列。钢琴的两只手，也能让人想起鼓点与行进的脚步。",
    about:"大家熟悉的《土耳其进行曲》是莫扎特《A大调第十一钢琴奏鸣曲》的终乐章。“土耳其风格”指当时欧洲人喜爱的军乐音响。右手细小灵活的装饰与左手有棱角的节奏交替出现。此版由罗穆阿尔德·格赖斯演奏，使用一台制于1850年的 Budynowicz 钢琴。",
    cues:[{label:"开场的小转弯",text:"留意右手怎样用很快的几个小音绕向重音。短句一问一答，偶尔会以相似的形状再出现。"}, {label:"认出行进声",text:"响亮段落中，两只手一起强调拍点。试着只敲左手的节奏，感受它怎样把轻巧的旋律变得昂首阔步。"}, {label:"熟悉段落重现",text:"轻的、重的段落轮换时，试着预判下一句。到结尾，紧凑的和弦把进行曲的节奏推向最后一拍。"}],
    file:"4/4e/Mozart-Marsz_turecki-%28Romuald_Greiss%29.ogg",credit:"Romuald Greiss（钢琴）",license:"公有领域"
  },
  {
    title:"第一号吉姆诺佩迪",original:"Gymnopédie No. 1",composer:"埃里克·萨蒂",latin:"Erik Satie",
    period:"十九世纪末",genre:"钢琴独奏",duration:187,
    summary:"低音落下，和弦轻轻托起，旋律从上方经过。三拍子的摇摆里，听一听什么在重复、什么在悄然改变。",
    about:"萨蒂写于1888年的这首钢琴小品，以缓慢的三拍子展开。低处的单音和随后响起的和弦维持着稳定的步幅；上方的旋律却常把一个音拉长，跨过拍点。正是这两种不同的时间感，让音乐既有方向，又像停在原地。",
    cues:[{label:"轻数三个拍子",text:"数“一、二、三”。第一拍低音落下，后面的和弦像轻轻换了一口气。先听完整的两组。"}, {label:"旋律浮在上方",text:"右手唱进来以后，手指继续数拍，耳朵跟着长音走。听它怎样在伴奏已经变化时仍停留片刻。"}, {label:"相似中的差别",text:"旋律再次走过熟悉的路时，留意下面换了什么和声。同样的步幅，可以有完全不同的明暗。"}],
    file:"6/68/Kevin_MacLeod_-_Erik_Satie_Gymnopedie_No_1.ogg",credit:"Kevin MacLeod",license:"CC BY 3.0"
  },
  {
    title:"糖梅仙子之舞",original:"Dance of the Sugar Plum Fairy",composer:"彼得·伊里奇·柴可夫斯基",latin:"Pyotr Ilyich Tchaikovsky",
    period:"浪漫主义",genre:"芭蕾舞曲",duration:120,
    summary:"先听轻巧的脚步，再等一串清脆的声音出现。旋律的轮廓不大，独特的音色却让角色立刻现身。",
    about:"在芭蕾舞剧《胡桃夹子》中，这一段属于糖梅仙子。原谱让钢片琴担任主角：演奏者按下琴键，小槌便敲响金属片。清亮、略带余响的高音，被低处短促的伴奏衬托出来。第一次听可以只追踪这层亮色，第二次再听底下有哪些声音在回应。",
    cues:[{label:"等候角色登场",text:"听开头低处短短的音。高处清脆的主题出现时，想象两种声音分别占据舞台的前后方。"}, {label:"寻找低处的回答",text:"高音短句收住时，把注意力往下移。较低的声部偶尔伸出一句，与上面的俏皮旋律形成对话。"}, {label:"听一串细碎的亮音",text:"密集的高音仿佛从一个音区滚向另一个音区。熟悉的步子回来以后，留意末尾怎样干净地收住。"}],
    file:"d/de/Kevin_MacLeod_-_P_I_Tchaikovsky_Dance_of_the_Sugar_Plum_Fairy.ogg",credit:"Kevin MacLeod",license:"CC BY 3.0"
  },
  {
    title:"E小调前奏曲",original:"Prelude in E minor, Op. 28 No. 4",composer:"弗雷德里克·肖邦",latin:"Frédéric Chopin",
    period:"浪漫主义",genre:"钢琴独奏",duration:126,
    summary:"右手像迟迟说不完一句话，左手的和弦却一点点下沉。两分钟里，听清一次蓄力、倾诉和沉默。",
    about:"肖邦的作品28包含二十四首前奏曲，这首排列第四。右手用很少的音构成一条缓慢的线，左手则反复弹奏轻柔的和弦。仔细听，和弦里面往往只有一两个声音改变位置；这些很小的变化逐渐累积，最终让短暂的高潮显得格外强烈。",
    cues:[{label:"听一句长呼吸",text:"哼最上方的旋律。听它徘徊在相近音高时，下面的重复和弦还在悄悄往前走。"}, {label:"等待旋律挣脱",text:"留心右手何时忽然唱得更高、更急。对照先前克制的重复，这一次抬头的分量就会很明显。"}, {label:"让停顿也算一句",text:"高潮过去后，跟着声音往低处走。最后几个和弦之间留有空间，等余响消失再暂停。"}],
    file:"e/e8/FChopinPreludeOp28n4.OGG",credit:"Porticodoro / SmartCGArt Media Productions",license:"CC BY 3.0"
  },
  {
    title:"致爱丽丝",original:"Für Elise, WoO 59",composer:"路德维希·范·贝多芬",latin:"Ludwig van Beethoven",
    period:"古典主义",genre:"钢琴独奏",duration:177,
    summary:"两颗相邻的音来回摇摆，构成一个一听就能认出的开头。带着它走进两个插段，再听它怎样带你回家。",
    about:"《致爱丽丝》是一首A小调钢琴小品。熟悉的主题在两段性格不同的音乐之间返回，给这首短曲留下清晰的方向感。第一次听可以把主题当作路标：每当那两个挨得很近的音再次摇动，就知道已经回到原处。",
    cues:[{label:"记住两个音",text:"听右手一上一下地犹豫，再向低处落下。左手在句尾接住它，像一个安静的回答。"}, {label:"辨认两次出走",text:"其中一段有明亮、流畅的跑动，另一段则出现低音反复敲击。听这两种变化各自怎样远离开头的柔和。"}, {label:"等主题再来",text:"听到那两个熟悉的音时，轻轻哼出下一句。经历过低音的紧张之后，最后一次返回是什么感受？"}],
    file:"8/8f/Fur_Elise.ogg",credit:"Sebion7125",license:"CC BY-SA 3.0"
  }
].map(({file,...track}) => ({
  ...track,
  audio: "https://upload.wikimedia.org/wikipedia/commons/" + file,
  source: "https://commons.wikimedia.org/wiki/File:" + file.split("/").pop(),
  licenseUrl: track.license === "CC BY 3.0" ? "https://creativecommons.org/licenses/by/3.0/" :
    track.license === "CC BY-SA 3.0" ? "https://creativecommons.org/licenses/by-sa/3.0/" : "https://creativecommons.org/publicdomain/mark/1.0/"
}));

const $=id=>document.getElementById(id);
const tracks=window.TRACKS, key='riting.collections.v1';
const dayNumber=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)};
const indexFor=d=>((d-20770)%tracks.length+tracks.length)%tracks.length;
let today=dayNumber(),day=today,ix=indexFor(day),selected=0,preview=false,folders;
function recover(){try{const data=JSON.parse(localStorage.getItem(key));if(Array.isArray(data)&&data.length&&data.every(f=>typeof f.name==='string'&&Array.isArray(f.items)))return data}catch{}return [{name:'我的最爱',items:[]}]}
folders=recover();
function persist(data){localStorage.setItem(key,JSON.stringify(data));folders=data}
const make=(tag,txt,cls)=>{const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e};
const fill=(id,txt)=>$(id).textContent=txt;
function paint(n){
 const c=$('art').getContext('2d'),p=[['#2b494b','#71958a','#d8d3a5'],['#514738','#a1936c','#edcc8c'],['#384658','#798da0','#e1cba2'],['#4a424a','#aa8b87','#ead9b3']][n%4];
 let s=n+137;const rnd=()=>((s=(1664525*s+1013904223)>>>0)/4294967296);
 c.fillStyle=p[0];c.fillRect(0,0,600,600);c.fillStyle=p[2];c.beginPath();c.arc(407,154,60,0,Math.PI*2);c.fill();
 for(let layer=0;layer<4;layer++){const base=225+layer*45;c.fillStyle=[p[1],p[0],p[1],p[0]][layer];c.beginPath();c.moveTo(0,600);for(let x=0;x<=600;x+=2){let y=base+35*Math.sin(x/103+layer*1.4+n)+21*Math.cos(x/75+layer);c.lineTo(x,y)}c.lineTo(600,600);c.fill()}
 for(let j=0;j<900;j++){let x=rnd()*600,y=407+rnd()*193;c.globalAlpha=.16+rnd()*.4;c.strokeStyle=p[1];c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+12,y-2,x+rnd()*35,y);c.stroke()}c.globalAlpha=1;
 for(let j=0;j<16000;j++){c.fillStyle=rnd()>.5?'#fff':'#101e20';c.globalAlpha=rnd()*.13;c.fillRect(rnd()*600,rnd()*600,1+rnd()*2,1)}c.globalAlpha=1
}
function render(){
 const t=tracks[ix];fill('edition',preview?'收藏选听':day===today?'今日推荐':'往日推荐');$('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short',timeZone:'UTC'}).format(day*86400000);$('next').disabled=day>=today;$('date').parentElement.hidden=preview;
 fill('album',t.original);fill('who',t.composer+'　/　'+t.latin);fill('title',t.title);fill('original',t.original);fill('summary',t.summary);fill('about',t.about);$('tags').replaceChildren(...[t.period,t.genre,Math.floor(t.duration/60)+' 分 '+String(t.duration%60).padStart(2,'0')+' 秒'].map(x=>make('span',x)));
 $('cues').replaceChildren(...t.cues.map((a,i)=>{const row=make('div','','cue'),b=make('div','');b.append(make('h3',a.label),make('p',a.text));row.append(make('b','0'+(i+1)),b);return row}));
 const link=make('a','录音来源与授权 ↗');link.href=t.source;link.target='_blank';link.rel='noopener';$('credit').replaceChildren(document.createTextNode(t.credit+' · '+t.license+'　'),link);
 $('netease').href='https://music.163.com/#/search/m/?s='+encodeURIComponent(t.composer+' '+t.title)+'&type=1';
 $('audio').pause();$('audio').src=t.audio;$('playerbox').hidden=true;fill('play','▶　播放作品');fill('state','');saved();paint(ix)
}
function saved(){fill('save',folders.some(f=>f.items.includes(tracks[ix].original))?'✓　已收藏':'＋　收藏作品')}
function page(lib){$('library').hidden=!lib;$('daily').hidden=lib;$('home').setAttribute('aria-current',String(!lib));$('lib').setAttribute('aria-current',String(lib));if(lib){$('audio').pause();collection()}}
$('home').onclick=()=>{today=dayNumber();day=today;preview=false;ix=indexFor(day);render();page(false)};$('lib').onclick=()=>page(true);
function move(delta){day=Math.min(today,day+delta);ix=indexFor(day);render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
setInterval(()=>{const d=dayNumber();if(d!==today){const follow=day===today&&!preview;today=d;if(follow){day=d;ix=indexFor(day);render()}}},15000);
const audio=$('audio');$('play').onclick=async()=>{$('playerbox').hidden=false;if(!audio.paused){audio.pause();return}try{await audio.play()}catch(e){if(e.name!=='AbortError')fill('state','当前录音未能播放。可以重试，或去网易云选听同一作品。')}};
audio.onplay=()=>{fill('play','Ⅱ　暂停播放');fill('state','')};audio.onpause=audio.onended=()=>fill('play','▶　播放作品');audio.onerror=()=>{if(!$('playerbox').hidden)fill('state','当前录音加载失败，可去网易云选听。')};
$('save').onclick=()=>{folders=recover();fill('savename',tracks[ix].composer+' · '+tracks[ix].title);$('choices').replaceChildren(...folders.map(f=>{const l=make('label',''),c=make('input','');c.type='checkbox';c.checked=f.items.includes(tracks[ix].original);l.append(c,document.createTextNode(' '+f.name));return l}));$('newfolder').value='';fill('error','');$('modal').showModal()};
$('cancel').onclick=()=>$('modal').close();
$('confirm').onclick=()=>{const data=recover(),name=$('newfolder').value.trim(),id=tracks[ix].original;if(name&&data.some(f=>f.name===name)){fill('error','已有同名收藏夹，请勾选上方的收藏夹。');return}
 const inputs=[...$('choices').querySelectorAll('input')];for(const [i,f] of folders.entries()){const g=data.find(g=>g.name===f.name);if(g){g.items=g.items.filter(x=>x!==id);if(inputs[i].checked)g.items.push(id)}}if(name)data.push({name,items:[id]});try{persist(data);saved();$('modal').close()}catch{fill('error','浏览器无法保存，请检查存储设置。')}};
function collection(){folders=recover();selected=Math.min(selected,folders.length-1);fill('notice','');$('folders').replaceChildren(...folders.map((f,i)=>{const b=make('button',f.name+' · '+f.items.length,'btn');b.setAttribute('aria-pressed',String(i===selected));b.onclick=()=>{selected=i;collection()};return b}));const f=folders[selected];$('list').replaceChildren();if(!f.items.length)$('list').append(make('p','这个收藏夹还是空的。在作品页点击「收藏作品」，就能把喜欢的音乐放进来。','muted'));
 for(const id of f.items){const n=tracks.findIndex(t=>t.original===id);if(n<0)continue;const t=tracks[n],row=make('div','','row'),b=make('button',t.title+'　›','link'),del=make('button','移出','btn');b.append(make('small','　'+t.composer));b.onclick=()=>{ix=n;preview=true;render();page(false);window.scrollTo(0,0)};del.onclick=()=>{try{const data=recover(),target=data.find(x=>x.name===f.name);if(target)target.items=target.items.filter(x=>x!==id);persist(data);collection()}catch{fill('notice','移出失败，请检查浏览器存储设置。')}};row.append(b,del);$('list').append(row)}
}
$('create').onsubmit=e=>{e.preventDefault();const name=$('foldername').value.trim(),data=recover();if(!name||data.some(f=>f.name===name)){fill('notice','请输入一个尚未使用的收藏夹名称。');return}try{persist([...data,{name,items:[]}]);selected=folders.length-1;$('foldername').value='';collection()}catch{fill('notice','浏览器无法保存，请检查存储设置。')}};
window.addEventListener('storage',e=>{if(e.key===key&&!$('modal').open){folders=recover();saved();if(!$('library').hidden)collection()}});render();

</script></html>
